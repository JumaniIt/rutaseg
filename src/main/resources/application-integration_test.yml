spring:
  datasource:
    url: jdbc:h2:mem:rutaseg;mode=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: password
    driverClassName: org.h2.Driver
  h2:
    console.enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

files:
  directory: ${FILES_DIRECTORY:/resources}